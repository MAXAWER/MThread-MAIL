<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MThread Messenger</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: '#121416',
                        'surface-dim': '#0c0e10',
                        'surface-container': '#1e2022',
                        'primary-container': '#d0e2ff',
                        'on-primary-container': '#53647d',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        /* Mobile specific adjustments */
        @media (max-width: 767px) {
            .chat-list-panel { width: 100% !important; }
            .main-chat-panel { width: 100% !important; position: fixed; inset: 0; z-index: 50; display: none; }
            .chat-active .main-chat-panel { display: flex; }
            .chat-active .chat-list-panel { display: none; }
        }
    </style>
</head>
<body class="text-on-surface h-[100dvh] overflow-hidden">

    <div id="app-root" class="flex h-full w-full">
        
        <!-- 1. Narrow Sidebar (Desktop Only) -->
        <nav class="hidden md:flex flex-col w-[72px] bg-surface border-r border-white/5 py-6 items-center gap-6 shrink-0">
            <div class="mb-4">
                <div class="w-12 h-12 bg-primary-container rounded-2xl flex items-center justify-center ripple-container cursor-pointer hover:brightness-110 transition-all" onclick="window.location.reload()">
                    <span class="text-on-primary-container font-black text-xl">M</span>
                </div>
            </div>
            <div class="p-3 bg-primary-container/10 text-primary-container rounded-xl cursor-pointer ripple-container" onclick="document.getElementById('chat-list-container').scrollTo(0,0)">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">chat</span>
            </div>
            <div class="p-3 text-on-surface-variant hover:text-white cursor-pointer ripple-container" onclick="showSnackbar('Группы появятся в следующем обновлении')"><span class="material-symbols-outlined">group</span></div>
            <div class="mt-auto flex flex-col gap-6 items-center">
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/5 cursor-pointer ripple-container hover:brightness-110 transition-all" onclick="showSettings()"><img id="sidebar-avatar" src="https://ui-avatars.com/api/?name=Me&background=d0e2ff&color=53647d" alt=""></div>
            </div>
        </nav>

        <!-- 2. Chat List Panel -->
        <aside class="chat-list-panel flex flex-col w-full md:w-[350px] bg-surface-dim border-r border-white/5 shrink-0 h-full">
            <div class="p-6 md:p-8 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-white">Чаты</h2>
            </div>
            <div class="px-6 mb-4">
                <div class="flex items-center gap-3 bg-white/5 rounded-xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50 transition-all relative">
                    <span class="material-symbols-outlined text-on-surface-variant/50 text-sm">search</span>
                    <input type="text" id="user-search-input" placeholder="Поиск по логину..." class="bg-transparent border-none focus:ring-0 text-sm text-white w-full outline-none">
                    
                    <!-- Search Results Dropdown -->
                    <div id="user-search-results" class="absolute left-0 right-0 top-full mt-2 bg-surface-container border border-white/10 rounded-xl shadow-2xl z-50 hidden flex-col max-h-60 overflow-y-auto custom-scroll">
                    </div>
                </div>
            </div>
            <div id="chat-list-container" class="flex-1 overflow-y-auto custom-scroll">
                <!-- Chat list will be injected here -->
                <div class="chat-item-btn p-4 md:px-6 flex gap-4 cursor-pointer hover:bg-white/5 transition-all" onclick="toggleMobileChat(true)">
                    <div class="relative shrink-0">
                        <img src="https://ui-avatars.com/api/?name=Support&background=cac2e2&color=312d46" class="w-12 h-12 rounded-full" alt="">
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-surface-dim"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-1">
                            <h4 class="text-sm font-semibold text-white truncate">MThread Support</h4>
                            <span class="text-[10px] text-on-surface-variant/60">12:45</span>
                        </div>
                        <p class="text-xs text-on-surface-variant/60 truncate">Добро пожаловать в обновленный MThread!</p>
                    </div>
                </div>
            </div>
            <!-- Mobile Bottom Nav -->
            <div class="md:hidden flex justify-around p-4 pb-safe bg-surface border-t border-white/5 mt-auto shrink-0 z-50">
                <button class="text-primary-container flex flex-col items-center gap-1 ripple-container p-2 rounded-xl" onclick="document.getElementById('chat-list-container').scrollTo(0,0)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">chat</span><span class="text-[10px] uppercase font-bold">Чаты</span></button>
                <button class="text-on-surface-variant flex flex-col items-center gap-1 ripple-container p-2 rounded-xl" onclick="showSnackbar('Группы появятся в следующем обновлении')"><span class="material-symbols-outlined">group</span><span class="text-[10px] uppercase font-bold">Группы</span></button>
                <button class="text-on-surface-variant flex flex-col items-center gap-1 ripple-container p-2 rounded-xl" onclick="showSettings()"><span class="material-symbols-outlined">person</span><span class="text-[10px] uppercase font-bold">Профиль</span></button>
            </div>
        </aside>

        <!-- 3. Main Chat Panel -->
        <main class="main-chat-panel flex flex-col flex-1 bg-black relative h-full">
            <!-- Header -->
            <header class="h-[72px] px-4 md:px-8 flex items-center justify-between border-b border-white/5 bg-black/40 backdrop-blur-md shrink-0">
                <div class="flex items-center gap-4">
                    <button class="md:hidden p-2 text-on-surface-variant" onclick="toggleMobileChat(false)"><span class="material-symbols-outlined">arrow_back</span></button>
                    <div class="flex flex-col">
                        <h3 id="active-chat-name" class="text-lg font-bold text-white leading-tight">Выберите чат</h3>
                        <span id="active-chat-status" class="text-xs text-primary-container hidden transition-all"></span>
                    </div>
                </div>
                <div class="flex gap-1 relative">
                    <button id="chat-options-btn" class="p-2 text-on-surface-variant hover:text-white ripple-container rounded-full hidden"><span class="material-symbols-outlined">more_vert</span></button>
                    <!-- Chat Options Menu -->
                    <div id="chat-options-menu" class="absolute right-0 top-full mt-2 bg-surface-container border border-white/10 rounded-xl shadow-2xl z-[100] hidden flex-col w-48 overflow-hidden">
                        <button id="btn-clear-chat" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 transition-all flex items-center gap-3">
                            <span class="material-symbols-outlined text-[18px]">delete_sweep</span> Очистить историю
                        </button>
                    </div>
                </div>
            </header>

            <!-- Messages -->
            <div id="messages-container" class="flex-1 overflow-y-auto px-6 md:px-12 py-8 flex flex-col gap-6 custom-scroll">
                <!-- Messages will be injected here -->
            </div>

            <!-- Input -->
            <div class="p-2 pb-safe md:p-8 bg-gradient-to-t from-black via-black to-transparent shrink-0">
                <form id="message-form" class="max-w-5xl mx-auto flex items-end gap-1 md:gap-4 bg-surface-container/50 md:bg-surface-container/50 bg-black md:border border-white/5 p-1 md:p-2 rounded-[24px] md:rounded-[28px] focus-within:border-primary-container/30 transition-all shadow-2xl border-t border-white/10 md:border-t-0">
                    <div class="flex-1 py-2 md:py-3 pl-4 md:pl-2">
                        <textarea id="message-input" rows="1" placeholder="Сообщение..." class="w-full bg-transparent border-none focus:ring-0 text-white placeholder-on-surface-variant/30 outline-none resize-none custom-scroll text-[15px] md:text-base leading-snug"></textarea>
                    </div>
                    <button id="send-btn" type="submit" class="w-10 h-10 md:w-12 md:h-12 mb-1 md:mb-0 mr-1 md:mr-0 bg-primary-container text-on-primary-container rounded-full md:rounded-[20px] flex items-center justify-center hover:brightness-110 active:scale-95 transition-all ripple-container shrink-0">
                        <span class="material-symbols-outlined text-[18px] md:text-[24px]" style="font-variation-settings: 'FILL' 1">send</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Auth Modal Overlay -->
    <div id="auth-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[200] flex items-center justify-center">
        <!-- 1. Login Step -->
        <div id="step-login" class="bg-surface p-8 md:p-10 rounded-[32px] md:rounded-[48px] border border-white/10 max-w-md w-full mx-4 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary-container rounded-[24px] flex items-center justify-center mx-auto mb-4">
                    <span class="text-on-primary-container font-black text-2xl">M</span>
                </div>
                <h2 class="text-3xl font-black text-white">Вход</h2>
                <p class="text-on-surface-variant text-sm">Общедоступный мессенджер MThread</p>
            </div>
            <div class="space-y-4">
                <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                    <input id="login-username" type="text" placeholder="Логин" class="bg-transparent border-none focus:ring-0 text-white w-full outline-none">
                </div>
                <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                    <input id="login-password" type="password" placeholder="Пароль" class="bg-transparent border-none focus:ring-0 text-white w-full outline-none">
                </div>
                <button id="login-btn" class="w-full bg-primary-container text-on-primary-container py-4 rounded-[20px] font-bold hover:brightness-110 active:scale-95 transition-all ripple-container">Войти</button>
            </div>
            <p class="text-center mt-6 text-sm text-on-surface-variant">
                Нет аккаунта? <button onclick="showStep('step-register')" class="text-primary-container font-bold hover:underline">Зарегистрироваться</button>
            </p>
        </div>

        <!-- 2. Register Step -->
        <div id="step-register" class="bg-surface p-8 md:p-10 rounded-[32px] md:rounded-[48px] border border-white/10 max-w-md w-full mx-4 shadow-2xl hidden">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black text-white">Регистрация</h2>
                <p class="text-on-surface-variant text-sm">Создайте свой уникальный логин</p>
            </div>
            <div class="space-y-4">
                <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                    <input id="reg-username" type="text" placeholder="Придумайте логин" class="bg-transparent border-none focus:ring-0 text-white w-full outline-none">
                </div>
                <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                    <input id="reg-password" type="password" placeholder="Пароль" class="bg-transparent border-none focus:ring-0 text-white w-full outline-none">
                </div>
                <button id="register-btn" class="w-full bg-primary-container text-on-primary-container py-4 rounded-[20px] font-bold hover:brightness-110 active:scale-95 transition-all ripple-container">Создать аккаунт</button>
            </div>
            <p class="text-center mt-6 text-sm text-on-surface-variant">
                Уже есть аккаунт? <button onclick="showStep('step-login')" class="text-primary-container font-bold hover:underline">Войти</button>
            </p>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[250] items-center justify-center hidden">
        <div class="bg-surface p-8 rounded-[32px] md:rounded-[48px] border border-white/10 max-w-md w-full mx-4 shadow-2xl modal-enter relative">
            <button onclick="closeSettings()" class="absolute top-6 right-6 p-2 text-on-surface-variant hover:text-white ripple-container rounded-full">
                <span class="material-symbols-outlined">close</span>
            </button>
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-white mb-2">Настройки Профиля</h2>
                <div class="relative w-24 h-24 mx-auto mt-6 group cursor-pointer" onclick="document.getElementById('avatar-upload-input').click()">
                    <img id="settings-avatar" src="https://ui-avatars.com/api/?name=U" class="w-24 h-24 rounded-full border-4 border-surface-container object-cover transition-all group-hover:brightness-50">
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all">
                        <span class="material-symbols-outlined text-white text-3xl">add_a_photo</span>
                    </div>
                    <button class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container w-8 h-8 rounded-full flex items-center justify-center ripple-container pointer-events-none">
                        <span class="material-symbols-outlined text-[16px]">edit</span>
                    </button>
                    <input type="file" id="avatar-upload-input" accept="image/*" class="hidden">
                </div>
                <div id="upload-progress" class="text-[10px] text-primary-container mt-2 font-bold hidden">Загрузка...</div>
            </div>
            
            <form id="settings-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider pl-4">Отображаемое имя</label>
                    <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                        <input id="settings-name" type="text" class="bg-transparent border-none focus:ring-0 text-white w-full outline-none" required>
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider pl-4">О себе (Статус)</label>
                    <div class="bg-white/5 rounded-2xl px-4 py-3 border border-white/5 focus-within:border-primary-container/50">
                        <input id="settings-bio" type="text" placeholder="Напишите что-нибудь о себе..." class="bg-transparent border-none focus:ring-0 text-white w-full outline-none">
                    </div>
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" class="flex-1 py-4 rounded-[20px] font-bold text-white bg-white/5 hover:bg-white/10 transition-all ripple-container" onclick="firebase.auth().signOut()">Выйти</button>
                    <button type="submit" id="settings-save-btn" class="flex-1 py-4 rounded-[20px] font-bold bg-primary-container text-on-primary-container hover:brightness-110 active:scale-95 transition-all ripple-container">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Snackbar Container -->
    <div id="snackbar-container"></div>

    <!-- Message Context Menu -->
    <div id="message-context-menu" class="fixed hidden bg-surface-container border border-white/10 rounded-xl shadow-2xl z-[300] min-w-[160px] overflow-hidden flex-col">
        <button id="ctx-btn-edit" class="w-full text-left px-4 py-3 text-sm text-white hover:bg-white/5 transition-all flex items-center gap-3">
            <span class="material-symbols-outlined text-[18px]">edit</span> Редактировать
        </button>
        <div class="w-full h-px bg-white/5"></div>
        <button id="ctx-btn-delete" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 transition-all flex items-center gap-3">
            <span class="material-symbols-outlined text-[18px]">delete</span> Удалить
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        function toggleMobileChat(active) {
            if (window.innerWidth <= 767) {
                if (active) {
                    document.body.classList.add('chat-active');
                } else {
                    document.body.classList.remove('chat-active');
                }
            }
        }
    </script>
</body>
</html>
